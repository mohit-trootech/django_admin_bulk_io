{%load bulk_io_urls_list%}
<div class="modal fade" id="bulkIoAdminModal" tabindex="0" aria-labelledby="bulkIoAdminModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title" id="bulkIoAdminModalLabel">
                    {% block admin-modal-title %}Bulk IO{% endblock %}
                </h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="file" accept=".csv, .json" name="file" id="bulk-io-fileinput" class="form-control" />
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-modal btn-secondary" data-bs-dismiss="modal">
                    Close
                </button>
                <button type="button" class="btn-modal btn-primary"
                    onclick="bulkIOImport(event, `{% bulk_io_url opts.app_label opts.model_name '%s_%s_bulk_import'%}`)">
                    Submit
                </button>
            </div>
        </div>
    </div>
</div>
